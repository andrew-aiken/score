apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "score.fullname" . }}-server
  labels:
    {{- include "score.labels" . | nindent 4 }}
    {{- include "score.selectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "score.selectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "score.labels" . | nindent 8 }}
        {{- include "score.selectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
    spec:
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - start
            {{- if .Values.server.db.enabled }}
            - --db
            - --db-path={{ .Values.server.db.path }}
            {{- end }}
            - --log-level
            - {{ .Values.server.logLevel | quote }}
          env:
            - name: NATS_ADDRESS
              value: {{ include "score.natsAddress" . | quote }}
            - name: NATS_CREDS
              value: /server.creds
            - name: SCORE_CONFIG
              value: /config.json
            - name: NATS_PUBLIC_URL
              value: {{ include "score.natsPublicUrl" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config.json
              subPath: config.json
              readOnly: true
            - name: server-creds
              mountPath: /server.creds
              subPath: server.creds
              readOnly: true
            {{- if or .Values.server.persistence.enabled .Values.server.db.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "score.configSecretName" . }}
        - name: server-creds
          secret:
            secretName: {{ include "score.serverCredsSecretName" . }}
        {{- if .Values.server.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "score.fullname" . }}-server-data
        {{- else if .Values.server.db.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
