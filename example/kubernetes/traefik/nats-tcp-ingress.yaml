---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: nats
  namespace: score
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - nats
  routes:
    - match: HostSNI(`*`)
      services:
        - name: score-nats
          namespace: score
          port: nats
